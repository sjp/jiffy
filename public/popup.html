<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jiffy</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 220px;
        font:
          13px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      p {
        margin: 0 0 12px;
        opacity: 0.75;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #6d28d9;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #7c3aed;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #8b5cf6;
        outline-offset: 2px;
      }
      #status {
        margin: 10px 0 0;
        opacity: 1;
        color: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        #status {
          color: #fca5a5;
        }
      }
      .all-sites {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 12px 0 0;
      }
      .hint {
        margin: 4px 0 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Jiffy</h1>
    <p>Pause, scrub, and replay animated images.</p>
    <button id="pick" type="button">Choose an image</button>
    <p id="status" role="status" hidden></p>
    <label class="all-sites">
      <input id="all-sites" type="checkbox" />
      Allow on all sites
    </label>
    <p class="hint">
      Optional. Needed for images inside embedded frames, and images a site won't hand over on its
      own.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
