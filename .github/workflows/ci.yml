name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run lint:js

      - run: npm test

      - run: npm run build:firefox

      # Lint the built Firefox extension against AMO's rules (errors fail the
      # job; warnings are reported). Needs dist-firefox/, so it runs after build.
      - run: npm run lint

      - run: npm run build:chrome
