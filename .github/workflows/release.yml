name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run pack

      - name: Upload Firefox extension
        uses: actions/upload-artifact@v4
        with:
          name: jiffy-firefox-${{ github.ref_name }}
          path: jiffy-firefox.zip
          if-no-files-found: error

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: jiffy-chrome-${{ github.ref_name }}
          path: jiffy-chrome.zip
          if-no-files-found: error
