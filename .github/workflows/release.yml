name: Release

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          # Stamp the release tag into the built manifests (build.mjs strips the
          # "release/" prefix). e.g. tag release/1.2.0 → manifest version 1.2.0.
          JIFFY_VERSION: ${{ github.ref_name }}

      - run: npm run pack

      # Attach the packaged extensions to a permanent GitHub Release (CI
      # artifacts expire). The tag already exists — it triggered this run — so
      # `gh release create` just publishes against it. Uses the built-in gh CLI
      # and GITHUB_TOKEN rather than a third-party action.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            jiffy-firefox.zip jiffy-chrome.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
