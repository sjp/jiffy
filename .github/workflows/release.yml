name: Release

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The same gate CI runs, in the same order (its smoke job included, below
      # the build). A tag can be pushed from a branch that never went through CI,
      # so the release must not be the first time any of these are checked.
      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run lint:js

      - run: npm test

      - run: npm run build
        env:
          # Stamp the release tag into the built manifests (build.mjs strips the
          # "release/" prefix). e.g. tag release/1.2.0 → manifest version 1.2.0.
          JIFFY_VERSION: ${{ github.ref_name }}

      # Lint the built Firefox extension against AMO's rules. Needs
      # dist-firefox/, so it runs after the build.
      - run: npm run lint

      # The real-browser pass CI runs as its own job. It downloads the Chrome
      # the manifest's floor names, so it is a minute and a network dependency —
      # worth both here, since this is the last chance to notice that the thing
      # being published doesn't actually run. dist-chrome/ is built above.
      - run: npm run test:smoke

      - run: npm run pack

      # The curated CHANGELOG section for this version, which scripts/release.sh
      # rolled out of [Unreleased] before tagging. If it isn't there (a tag
      # pushed by hand), fall back to gh's generated commit list.
      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#release/}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG section for $version; using generated notes."
          fi

      # Attach the packaged extensions to a permanent GitHub Release (CI
      # artifacts expire). The tag already exists — it triggered this run — so
      # `gh release create` just publishes against it. Uses the built-in gh CLI
      # and GITHUB_TOKEN rather than a third-party action.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FLAG:
            ${{ steps.notes.outputs.have_notes == 'true' && '--notes-file release-notes.md' ||
            '--generate-notes' }}
        run: |
          gh release create "${{ github.ref_name }}" \
            jiffy-firefox.zip jiffy-chrome.zip \
            --title "${{ github.ref_name }}" \
            $NOTES_FLAG
